name: CI

# Everything here runs without secrets: no Stripe key, no Google credentials, no
# AWS. That is deliberate - it means CI runs on every push including from forks,
# and nothing in the pipeline can charge a card or write to a live spreadsheet.
# The charging tests (tests/10-registration-flow.spec.ts) stay a manual,
# pre-launch step: see tests/README.md.

on:
  # Every branch, not just main. next.config.mjs stops `next build` from
  # typechecking and linting on Vercel, so this workflow is now the only thing
  # that catches a type error - it has to run on the feature branches where the
  # work actually happens, not just once the change has already merged.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed on the source branch rather than github.ref so that a branch push and
  # the pull_request event for that same branch share a group, and the older run
  # is cancelled instead of both burning a runner.
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in step with engines.node in package.json, .nvmrc, and the
          # Node.js Version in Vercel project settings. Vercel drops Node 20
          # builds after 2026-10-01.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Warnings are expected and do not fail the build - see the note in
      # .eslintrc.js. Errors do.
      - name: Lint
        run: npm run lint

      - name: Offline tests
        # Config, order pricing and cross-file event data integrity, across
        # every event. No TEST_EVENT_ID, so the specs cover all of them in one
        # run rather than one invocation each.
        run: npm run test:offline
